<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-label="Scorecard of a real ContentForge pipeline run: overall 9.0 grade A approved; five dimension scores; run audit clean with 14 checks passed; 20 AI-pattern instances removed; 42 claims verified with zero hallucinations">
  <defs>
    <style>
      .h  { font: 700 22px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .sub{ font: 400 14px 'Segoe UI', Arial, sans-serif; fill: #475569; }
      .big{ font: 800 64px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .grade{ font: 700 20px 'Segoe UI', Arial, sans-serif; fill: #166534; }
      .dim{ font: 600 14px 'Segoe UI', Arial, sans-serif; fill: #334155; }
      .val{ font: 700 14px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .fact{ font: 600 15px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .factsub{ font: 400 12.5px 'Segoe UI', Arial, sans-serif; fill: #64748b; }
      .ph { font: 600 11px 'Segoe UI', Arial, sans-serif; fill: #475569; }
      .pht{ font: 400 10.5px 'Segoe UI', Arial, sans-serif; fill: #94a3b8; }
    </style>
  </defs>
  <rect width="1200" height="460" fill="#f8fafc"/>
  <rect x="0" y="0" width="1200" height="6" fill="#f97316"/>

  <text x="40" y="52" class="h">A real run, re-derived from its own artifacts</text>
  <text x="40" y="76" class="sub">Blog, 1,200 words, keyword "link rot" — August 16, 2026, digital-preservation validation brand. Every number below is read from the run's JSON artifacts.</text>

  <!-- Overall score block -->
  <rect x="40" y="100" width="240" height="180" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="160" y="185" text-anchor="middle" class="big">9.0</text>
  <rect x="95" y="205" width="130" height="30" rx="15" fill="#dcfce7"/>
  <text x="160" y="226" text-anchor="middle" class="grade">Grade A · APPROVED</text>
  <text x="160" y="260" text-anchor="middle" class="sub">Phase 7 review (pass floor: 7.0)</text>

  <!-- Dimension bars -->
  <rect x="310" y="100" width="440" height="180" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <g>
    <text x="330" y="132" class="dim">Content quality</text>
    <rect x="480" y="121" width="220" height="12" rx="6" fill="#e2e8f0"/>
    <rect x="480" y="121" width="193.6" height="12" rx="6" fill="#2563eb"/>
    <text x="710" y="132" class="val">8.8</text>

    <text x="330" y="164" class="dim">Citation integrity</text>
    <rect x="480" y="153" width="220" height="12" rx="6" fill="#e2e8f0"/>
    <rect x="480" y="153" width="195.8" height="12" rx="6" fill="#2563eb"/>
    <text x="710" y="164" class="val">8.9</text>

    <text x="330" y="196" class="dim">Brand compliance</text>
    <rect x="480" y="185" width="220" height="12" rx="6" fill="#e2e8f0"/>
    <rect x="480" y="185" width="211.2" height="12" rx="6" fill="#16a34a"/>
    <text x="710" y="196" class="val">9.6</text>

    <text x="330" y="228" class="dim">SEO performance</text>
    <rect x="480" y="217" width="220" height="12" rx="6" fill="#e2e8f0"/>
    <rect x="480" y="217" width="189.2" height="12" rx="6" fill="#2563eb"/>
    <text x="710" y="228" class="val">8.6</text>

    <text x="330" y="260" class="dim">Readability</text>
    <rect x="480" y="249" width="220" height="12" rx="6" fill="#e2e8f0"/>
    <rect x="480" y="249" width="193.6" height="12" rx="6" fill="#2563eb"/>
    <text x="710" y="260" class="val">8.8</text>
  </g>

  <!-- Facts column -->
  <rect x="780" y="100" width="380" height="180" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <g>
    <circle cx="806" cy="130" r="5" fill="#16a34a"/>
    <text x="822" y="135" class="fact">Run audit: CLEAN — 14 passed · 0 failed · 1 N/A</text>
    <text x="822" y="152" class="factsub">re-derived from the artifacts before "completed" was allowed</text>

    <circle cx="806" cy="180" r="5" fill="#16a34a"/>
    <text x="822" y="185" class="fact">42 claims diffed against the verified ledger</text>
    <text x="822" y="202" class="factsub">zero hallucinations; 1 citation-placement fix, applied by script</text>

    <circle cx="806" cy="230" r="5" fill="#f97316"/>
    <text x="822" y="235" class="fact">20 AI-pattern instances removed (7 categories)</text>
    <text x="822" y="252" class="factsub">every edit logged before → after; facts and SEO byte-stable</text>
  </g>

  <!-- Phase timeline -->
  <text x="40" y="322" class="h" style="font-size:16px">The 10 phases, as they ran</text>
  <g>
    <rect x="40" y="338" width="1120" height="2" fill="#cbd5e1"/>
    <g transform="translate(40,0)">
      <circle cx="20"  cy="339" r="6" fill="#2563eb"/><text x="20"  y="366" text-anchor="middle" class="ph">Research</text><text x="20" y="380" text-anchor="middle" class="pht">10 min</text>
      <circle cx="132" cy="339" r="6" fill="#2563eb"/><text x="132" y="366" text-anchor="middle" class="ph">Fact-check</text><text x="132" y="380" text-anchor="middle" class="pht">11 min</text>
      <circle cx="244" cy="339" r="6" fill="#2563eb"/><text x="244" y="366" text-anchor="middle" class="ph">Draft</text><text x="244" y="380" text-anchor="middle" class="pht">108 min</text>
      <circle cx="356" cy="339" r="6" fill="#2563eb"/><text x="356" y="366" text-anchor="middle" class="ph">Visuals</text><text x="356" y="380" text-anchor="middle" class="pht">18 min</text>
      <circle cx="468" cy="339" r="6" fill="#2563eb"/><text x="468" y="366" text-anchor="middle" class="ph">Validation</text><text x="468" y="380" text-anchor="middle" class="pht">13 min</text>
      <circle cx="580" cy="339" r="6" fill="#2563eb"/><text x="580" y="366" text-anchor="middle" class="ph">Structure</text><text x="580" y="380" text-anchor="middle" class="pht">14 min</text>
      <circle cx="692" cy="339" r="6" fill="#2563eb"/><text x="692" y="366" text-anchor="middle" class="ph">SEO/GEO</text><text x="692" y="380" text-anchor="middle" class="pht">20 min</text>
      <circle cx="804" cy="339" r="6" fill="#f97316"/><text x="804" y="366" text-anchor="middle" class="ph">Humanize</text><text x="804" y="380" text-anchor="middle" class="pht">16 min</text>
      <circle cx="916" cy="339" r="6" fill="#16a34a"/><text x="916" y="366" text-anchor="middle" class="ph">Review</text><text x="916" y="380" text-anchor="middle" class="pht">7 min</text>
      <circle cx="1028" cy="339" r="6" fill="#16a34a"/><text x="1028" y="366" text-anchor="middle" class="ph">Output</text><text x="1028" y="380" text-anchor="middle" class="pht">survived 2 session drops</text>
    </g>
  </g>
  <text x="40" y="418" class="sub">Phase 8 was killed twice by session limits mid-run; the checkpoint contract resumed it from disk both times — the delivered .docx and this scorecard exist because resume is a contract, not a hope.</text>
  <text x="40" y="440" class="factsub">Source artifacts: phase-7-review.json · run-audit.json · phase-6.5-report.md · pipeline-run.json (brand: validation persona; not client work)</text>
</svg>
