<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="larr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0d6b5c"/>
    </marker>
  </defs>

  <text x="490" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#8a94a4">The content lifecycle loop (v4.0) — every joint is a file, so the loop survives sessions</text>

  <!-- center label -->
  <g text-anchor="middle">
    <circle cx="490" cy="300" r="86" fill="#eef1f5" stroke="#c4ccd8"/>
    <text x="490" y="288" font-size="13.5" font-weight="700" fill="#1f2733">per-brand state</text>
    <text x="490" y="308" font-size="11.5" fill="#5a6577">~/.claude-marketing/&lt;brand&gt;/</text>
    <text x="490" y="326" font-size="11.5" fill="#5a6577">rides Drive sync on Cowork</text>
  </g>

  <!-- five stations -->
  <g font-size="14" text-anchor="middle">
    <g>
      <rect x="390" y="62" width="200" height="66" rx="12" fill="#e5f1ee" stroke="#0d6b5c" stroke-width="1.4"/>
      <text x="490" y="88" font-weight="700" fill="#1f2733">PLAN</text>
      <text x="490" y="107" fill="#5a6577" font-size="11.5">cf-calendar · cf-brief</text>
    </g>
    <g>
      <rect x="710" y="180" width="210" height="66" rx="12" fill="#e5f1ee" stroke="#0d6b5c" stroke-width="1.4"/>
      <text x="815" y="206" font-weight="700" fill="#1f2733">PRODUCE</text>
      <text x="815" y="225" fill="#5a6577" font-size="11.5">10-phase pipeline · 10 gates</text>
    </g>
    <g>
      <rect x="660" y="420" width="210" height="66" rx="12" fill="#e5f1ee" stroke="#0d6b5c" stroke-width="1.4"/>
      <text x="765" y="446" font-weight="700" fill="#1f2733">PUBLISH</text>
      <text x="765" y="465" fill="#5a6577" font-size="11.5">.docx + run audit · /publish</text>
    </g>
    <g>
      <rect x="110" y="420" width="210" height="66" rx="12" fill="#e5f1ee" stroke="#0d6b5c" stroke-width="1.4"/>
      <text x="215" y="446" font-weight="700" fill="#1f2733">MEASURE</text>
      <text x="215" y="465" fill="#5a6577" font-size="11.5">cf-aeo-check · cf-analytics</text>
    </g>
    <g>
      <rect x="60" y="180" width="210" height="66" rx="12" fill="#e5f1ee" stroke="#0d6b5c" stroke-width="1.4"/>
      <text x="165" y="206" font-weight="700" fill="#1f2733">AUDIT</text>
      <text x="165" y="225" fill="#5a6577" font-size="11.5">cf-audit · freshness decay</text>
    </g>
  </g>

  <!-- loop arrows with file-contract labels -->
  <g stroke="#0d6b5c" stroke-width="2" fill="none">
    <path d="M 595 100 C 740 110, 800 130, 815 174" marker-end="url(#larr)"/>
    <path d="M 830 250 C 850 320, 840 370, 800 414" marker-end="url(#larr)"/>
    <path d="M 654 453 L 326 453" marker-end="url(#larr)"/>
    <path d="M 195 414 C 150 370, 140 320, 158 250" marker-end="url(#larr)"/>
    <path d="M 175 176 C 200 120, 300 100, 384 96" marker-end="url(#larr)"/>
  </g>

  <g font-size="11.5" fill="#0d6b5c" font-weight="600">
    <text x="712" y="128">briefs + refresh slots</text>
    <text x="872" y="345">run-audited</text>
    <text x="872" y="362">deliverable</text>
    <text x="428" y="443">aeo/checks.json</text>
    <text x="428" y="460" font-weight="400" fill="#5a6577">append-only history</text>
    <text x="70" y="340">AI-citation deltas</text>
    <text x="70" y="357" font-weight="400" fill="#5a6577">feed freshness scores</text>
    <text x="205" y="128">audits/audit-&lt;date&gt;.json</text>
    <text x="205" y="145" font-weight="400" fill="#5a6577">audit-ledger.py · validated</text>
  </g>

  <!-- lifecycle chips feeding PRODUCE from per-brand state -->
  <g text-anchor="middle">
    <rect x="592" y="278" width="235" height="44" rx="9" fill="#f9efe2" stroke="#b06414"/>
    <text x="709" y="296" font-size="11" font-weight="700" fill="#1f2733">Gate 1 → brand_pages merge</text>
    <text x="709" y="312" font-size="10" fill="#5a6577">verified links persist; CTAs only staged</text>
    <rect x="592" y="330" width="235" height="44" rx="9" fill="#f9efe2" stroke="#b06414"/>
    <text x="709" y="348" font-size="11" font-weight="700" fill="#1f2733">telemetry advisories → Phase 3 brief</text>
    <text x="709" y="364" font-size="10" fill="#5a6577">recurrence floor; never touches a gate</text>
  </g>

  <text x="490" y="545" text-anchor="middle" font-size="11.5" fill="#8a94a4">Advisories inform briefs and dashboards only — they never modify a gate, a threshold, or a verdict</text>
</svg>
